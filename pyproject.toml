[project]
name = "decision-chain"
version = "0.1.0"
description = "Integration capstone: one real dataset flowing through the whole distributor decision chain, with machine-checked cross-stage reconciliation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Dimitres Kisimov" }]
keywords = ["supply-chain", "forecasting", "reconciliation", "analytics", "uci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
